<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><title>TechPath · Colégio Árvore da Felicidade</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#071326;--c:#0d1f3a;--t:#eef6ff;--m:#93a8c4;--g:#3aa84a;--l:#a6d630;--cy:#38d6f5;--pu:#8b6cf0;--b:#1c3358;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f2f7f1;--c:#fff;--t:#10261a;--m:#4d6657;--b:#cfe0cf;--g:#2a8a38}}
:root[data-theme=light]{--bg:#f2f7f1;--c:#fff;--t:#10261a;--m:#4d6657;--b:#cfe0cf;--g:#2a8a38}
*{box-sizing:border-box}html{height:100%}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:Fredoka,Inter,sans-serif;line-height:1.15;margin:0 0 .5em}h1{font-size:clamp(2rem,6vw,3.6rem)}
nav{display:flex;align-items:center;gap:14px;padding:12px 5vw;border-bottom:1px solid var(--b);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font:700 1.3rem Fredoka;cursor:pointer}.logo img{height:46px;background:#fff;border-radius:12px;padding:2px}
nav a{color:var(--m);cursor:pointer;font-weight:600}nav a:hover{color:var(--l)}nav .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:28px 5vw 60px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:600 1rem Inter;cursor:pointer}.btn:hover{filter:brightness(1.12)}.btn.o{background:none;border:1px solid var(--b);color:var(--t)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:13px 16px;font:inherit;cursor:pointer;transition:.2s}.opt:hover,.opt.on{border-color:var(--l);background:rgba(166,214,48,.12)}
.bar{height:9px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--l));border-radius:9px;transition:width .8s}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;padding:30px 0}.hero img{width:100%;max-width:340px;background:#fff;border-radius:28px;padding:8px;justify-self:center;box-shadow:0 0 70px rgba(58,168,74,.35)}
.tag{display:inline-block;background:rgba(56,214,245,.12);color:var(--cy);border-radius:20px;padding:2px 11px;font-size:.85rem;margin:2px}
.m{color:var(--m)}select,textarea{width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:10px;font:inherit}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--b);padding:9px;text-align:left;vertical-align:top}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero img{order:-1;max-width:220px}}
@media print{nav,.np{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #bbb;break-inside:avoid}.m{color:#444}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</script>

function path(){return`<h2>Como quer começar?</h2><div class="grid"><div class="card"><h3>Ainda não sei qual área seguir</h3><p class="m">Faça o teste de descoberta.</p><button class="btn" onclick="go('quiz')">Fazer o teste</button></div><div class="card"><h3>Já sei qual área quero seguir</h3><p class="m">Escolha a área e faça o diagnóstico.</p><select id="pa">${A.map((a,i)=>`<option value="${i}">${a[0]}</option>`).join('')}</select><br><br><button class="btn" onclick="go('diag',+$('pa').value)">Fazer diagnóstico</button></div><div class="card"><h3>Quero apenas explorar</h3><p class="m">Conheça as áreas sem testes.</p><button class="btn o" onclick="go('explore')">Explorar</button></div></div>`}
function quiz(){if(qi>=Q.length){return`<h2>Mais duas perguntas abertas</h2><p class="m">Elas complementam a análise, mas não alteram a pontuação.</p>${OQ.map((q,i)=>`<div class="card"><b>${q}</b><textarea rows="3" oninput="open[${i}]=this.value"></textarea></div>`).join('')}<button class="btn" onclick="fin()">Ver o meu resultado</button>`}
const q=Q[qi];return`<p class="m">Pergunta ${qi+1} de ${Q.length}</p>${bar(qi/Q.length*100)}<h2 style="margin-top:20px">${q[0]}</h2>${q[1].map((o,i)=>`<button class="opt" onclick="ans(${i})">${o[0]}</button>`).join('')}`}
function ans(i){Q[qi][1][i][1].forEach(a=>sc[a]++);qi++;R()}
function fin(){const r=sc.map((s,i)=>[i,s]).sort((a,b)=>b[1]-a[1]).slice(0,3);S.top=r.map(x=>[x[0],Math.round(x[1]/r[0][1]*87-(x[1]<r[0][1]?0:0))]);S.open=open;S.area=S.top[0][0];save();go('result')}
function result(){const t=S.top||[];if(!t.length)return path();const pf=[[0,1,2,10],'Builder','gosta de criar, aprende construindo e resolve problemas com criatividade técnica'];const k=t[0][0];const P=[3,4].includes(k)?['Explorador de dados','curioso, analítico e atraído por padrões e inteligência']:[5,6,7,8].includes(k)?['Investigador de sistemas','atento a detalhes, gosta de entender como as coisas funcionam por dentro']:[9,11].includes(k)?['Designer de soluções','pensa nas pessoas e em como as coisas devem funcionar']:['Builder','gosta de criar, aprende construindo e resolve problemas com criatividade técnica'];
return`<h2>Seu perfil: ${P[0]}</h2><p class="m">Seu perfil é ${P[1]}.</p>${t.map((x,i)=>`<div class="card"><b>${i+1}º ${A[x[0]][0]}</b> — ${x[1]}%${bar(x[1])}<p class="m">${A[x[0]][1]}</p></div>`).join('')}<div class="card"><p>Com base nas suas respostas, <b>${A[k][0]}</b> apresenta maior afinidade neste momento. Isso é uma indicação, não uma sentença. Você pode explorar outras áreas.</p></div><button class="btn" onclick="go('diag',${k})">Diagnosticar meu nível em ${A[k][0]}</button> <button class="btn o" onclick="go('explore')">Explorar outras áreas</button>`}
function explore(){const o=A.map((a,i)=>`<option value="${i}">${a[0]}</option>`).join('');return`<h2>Explore a Informática</h2><div class="grid">${A.map((a,i)=>`<div class="card"><h3>${a[0]}</h3><p class="m">${a[1]}</p><span class="tag">Dificuldade: ${a[4]}</span><br><br><button class="btn o" onclick="go('area',${i})">Ver detalhes</button></div>`).join('')}</div><div class="card"><h3>Comparar duas áreas</h3><select id="c1">${o}</select><br><br><select id="c2">${o.replace('value="1"','value="1" selected')}</select><br><br><button class="btn" onclick="cmp()">Comparar</button><div id="cr"></div></div>`}
function cmp(){const a=A[$('c1').value],b=A[$('c2').value];$('cr').innerHTML=`<br><table><tr><th></th><th>${a[0]}</th><th>${b[0]}</th></tr><tr><td>Tipo de trabalho</td><td>${a[1]}</td><td>${b[1]}</td></tr><tr><td>Conhecimentos</td><td>${a[2].join(', ')}</td><td>${b[2].join(', ')}</td></tr><tr><td>Profissões</td><td>${a[3]}</td><td>${b[3]}</td></tr><tr><td>Curva de aprendizagem</td><td>${a[4]}</td><td>${b[4]}</td></tr></table>`}
function area(){const a=A[dg.v];return`<button class="btn o" onclick="go('explore')">Voltar</button><h2 style="margin-top:16px">${a[0]}</h2><p>${a[1]}</p><div class="card"><b>Competências</b><br>${a[2].map(s=>`<span class="tag">${s}</span>`).join('')}</div><div class="card"><b>Possíveis profissões</b><p>${a[3]}</p><b>Ambientes:</b> <span class="m">startups, empresas de tecnologia, bancos, agências, freelance, empreendedorismo</span></div><div class="card"><b>Projetos por nível</b><ol>${a[5].map(p=>`<li>${p}</li>`).join('')}</ol><p class="m">Como ganhar experiência: construa projetos, publique no GitHub e participe de comunidades e estágios.</p></div><button class="btn" onclick="go('diag',${dg.v})">Diagnosticar meu nível</button>`}
function diag(){const a=A[dg.a];return`<h2>Diagnóstico: ${a[0]}</h2><p class="m">Seja honesto: o nível final combina o que você sabe com o que já construiu.</p><div class="card"><b>Nível que você acha que tem</b><select id="sl">${LV.map((l,i)=>`<option value="${i}">Nível ${i} — ${l}</option>`).join('')}</select></div>${a[2].map((s,i)=>`<div class="card"><b>${s}</b><select id="k${i}"><option value="0">Não conheço</option><option value="1">Conheço a teoria</option><option value="2">Sei aplicar</option></select><label class="m"><input type="checkbox" id="e${i}"> Já construí algo com isso</label></div>`).join('')}<button class="btn" onclick="fd()">Ver resultado e roadmap</button>`}
function fd(){const a=A[dg.a];const sk=a[2].map((_,i)=>+$('k'+i).value),ev=a[2].map((_,i)=>$('e'+i).checked?1:0);const pts=sk.reduce((x,y)=>x+y,0)/(sk.length*2),ne=ev.reduce((x,y)=>x+y,0);let lv=Math.round(pts*5);const cap=ne==0?1:ne<3?3:ne<5?4:5;lv=Math.min(lv,cap);S.area=dg.a;S.lv=lv;S.self=+$('sl').value;S.sk=sk;S.ev=ev;save();go('report')}
function dash(){if(S.lv===undefined)return`<h2>Meu caminho</h2><p>Você ainda não fez um diagnóstico.</p><button class="btn" onclick="go('path')">Começar</button>`;const a=A[S.area],l=S.lv,nx=Math.min(l+1,5);const w=a[2].map((s,i)=>[s,S.sk[i]]).sort((x,y)=>x[1]-y[1]);const st=['Dominado ✓','Em desenvolvimento ◐','Precisa fortalecer ○'];
return`<h2>${a[0]} — Nível ${l}: ${LV[l]}</h2>${S.self!==l?`<p class="m">Sua autoavaliação foi Nível ${S.self}; o nível considera também as evidências práticas.</p>`:''}<div class="card"><b>Progresso até o Nível ${nx}</b>${bar(Math.round(S.sk.reduce((x,y)=>x+y,0)/(S.sk.length*2)*100))}<p>Você está no Nível ${l}. Para chegar ao Nível ${nx}, precisa fortalecer <b>${w.slice(0,2).map(x=>x[0]).join(' e ')}</b>.</p></div><div class="card"><b>Competências</b>${a[2].map((s,i)=>`<p style="margin:10px 0 4px">${s} <span class="m">· ${st[2-S.sk[i]]}${S.ev[i]?' · com projeto':''}</span></p>${bar(S.sk[i]*50)}`).join('')}</div><div class="card"><b>Roadmap</b><ol><li><b>Fundamentos:</b> ${a[2].slice(0,2).join(' → ')}</li><li><b>Prática:</b> ${a[2].slice(2,4).join(' → ')}</li><li><b>Profissionalização:</b> ${a[2].slice(4).join(' → ')}</li><li><b>Portfólio:</b> projetos, GitHub, estágio ou freelance</li></ol></div><div class="card"><b>Seu próximo desafio</b><p>${a[5][Math.min(l,4)]}</p><p class="m">Não avance apenas consumindo cursos. Construa este projeto para demonstrar que domina esta etapa.</p></div><div class="card"><b>Profissões possíveis</b><p>${a[3]}</p></div><button class="btn" onclick="go('report')">Ver resultado completo</button> <button class="btn o" onclick="go('path')">Refazer ou mudar de área</button>`}
function mentor(){const a=S.lv!==undefined?`${A[S.area][0]}, Nível ${S.lv}`:'a sua área e nível';return`<h2>TechMentor</h2><div class="card"><p>Em breve: um assistente de IA que responde usando o seu perfil, nível, competências, projetos e objetivos, e não listas genéricas.</p><p class="m">Exemplos que poderá perguntar (${a}):</p><ul><li>O que devo estudar agora?</li><li>Quais projetos colocar no meu portfólio?</li><li>Quero migrar para cibersegurança. O que preciso aprender?</li></ul></div>`}
function secs(){const a=A[S.area],l=S.lv,t=S.top||[],w=a[2].map((s,i)=>[s,S.sk[i]]),g=n=>w.filter(x=>x[1]==n).map(x=>x[0]).join(', ')||'nenhuma por enquanto',nx=Math.min(l+1,5),pj=i=>a[5][Math.min(i,4)];const o=(S.open||[]).map((x,i)=>x&&x.trim()?`${OQ[i]} ${x.trim()}`:'').filter(Boolean);

["Seu nível atual",[`${a[0]} — Nível ${l}: ${LV[l]}`,`Autoavaliação: Nível ${S.self}. O nível final considera também os projetos já construídos.`]],

["Projetos recomendados",[`Agora: ${pj(l)}`,`Depois: ${pj(l+1)}`]],

...(o.length?[["Suas respostas abertas",o]]:[]),
["Importante",["Este resultado é uma indicação com base nas suas respostas, não uma sentença. Você pode explorar outras áreas e refazer o diagnóstico a qualquer momento."]]]}
function txt(){return"TECHPATH — RESULTADO COMPLETO\n"+new Date().toLocaleDateString('pt-PT')+"\n\n"+secs().map(x=>x[0].toUpperCase()+"\n"+x[1].join("\n")).join("\n\n")}
function report(){if(S.lv===undefined)return dash();return`<div class="card" style="display:flex;align-items:center;gap:14px"><img src="${document.querySelector('.logo img').src}" alt="" style="height:60px;background:#fff;border-radius:12px"><div><h2 style="margin:0">Seu resultado completo</h2><span class="m">TechPath · ${new Date().toLocaleDateString('pt-PT')}</span></div></div>${secs().map(x=>`<div class="card"><h3>${x[0]}</h3>${x[1].map(y=>`<p style="margin:.3em 0">${y}</p>`).join('')}</div>`).join('')}<div class="card np"><b>Receber este resultado</b><p class="m">Escolha como guardar ou enviar.</p><input id="em" type="email" placeholder="seu@email.com" style="width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:10px;margin-bottom:10px"><button class="btn" onclick="mail()">Enviar por e-mail</button> <button class="btn o" onclick="window.print()">Imprimir / salvar PDF</button> <button class="btn o" id="cb" onclick="cp()">Copiar texto</button></div><div class="np"><button class="btn o" onclick="go('dash')">Ver meu painel</button></div>`}
